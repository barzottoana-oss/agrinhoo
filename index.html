<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Agrinho - Inovação e Sustentabilidade</title>
    <style>
        /* --- VARIÁVEIS E CONFIGURAÇÕES GERAIS --- */
        :root {
            --verde-principal: #2e7d32;
            --verde-claro: #4caf50;
            --terra: #8d6e63;
            --amarelo-sol: #ffb300;
            --branco: #ffffff;
            --gelo: #f5f5f5;
            --grafite: #212121;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--gelo);
            color: var(--grafite);
            overflow-x: hidden;
        }

        /* --- TELA DE CARREGAMENTO (PORCENTAGEM) --- */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--verde-principal);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loader h2 {
            color: var(--branco);
            margin-bottom: 20px;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        .counter-container {
            font-size: 4rem;
            font-weight: bold;
            color: var(--amarelo-sol);
        }
